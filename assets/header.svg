<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <title>Tiago Rafael — Desenvolvedor Full Stack</title>
  <defs>
    <linearGradient id="name" x1="0" x2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#2e9ef7"/>
      <stop offset=".5" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#2e9ef7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2e9ef7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2e9ef7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .hi { fill: #8b949e; font-size: 15px; }
    .name { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
    .p { fill: #c9d1d9; font-size: 17px; }
    
    .hi, .name { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.3,1) forwards; }
    .name { animation-delay: .15s; }
    .p { clip-path: inset(0 100% 0 0); animation: cycle 14.4s linear infinite; }
    .bar { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes cycle {
      0% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(28); }
      7.64% { clip-path: inset(0 0 0 0); }
      20.14% { clip-path: inset(0 0 0 0); animation-timing-function: steps(14); }
      22.92% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes pulse { 0%,100% { transform: scaleX(.6); opacity: .6; } 50% { transform: scaleX(1); opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="859" height="169" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="858" height="168" rx="12" fill="url(#dots)" opacity=".55"/>
  <text class="hi" x="430.0" y="44" text-anchor="middle">olá, mundo! 👋 eu sou o</text>
  <text class="name" x="430.0" y="92" text-anchor="middle" fill="url(#name)">Tiago Rafael</text>
  <text class="p" x="430.0" y="128" text-anchor="middle" style="animation-delay:0.00s"><tspan fill="#3fb950">❯ </tspan>Desenvolvedor Full Stack</text><text class="p" x="430.0" y="128" text-anchor="middle" style="animation-delay:3.60s"><tspan fill="#3fb950">❯ </tspan>Next.js · Nest.js · TypeScript</text><text class="p" x="430.0" y="128" text-anchor="middle" style="animation-delay:7.20s"><tspan fill="#3fb950">❯ </tspan>Docker &amp; MySQL no dia a dia</text><text class="p" x="430.0" y="128" text-anchor="middle" style="animation-delay:10.80s"><tspan fill="#3fb950">❯ </tspan>Transformo café em deploy ☕</text>
  <rect class="bar" x="290.0" y="150" width="280" height="2" rx="1" fill="url(#glow)"/>
</svg>
