name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # ~03:17 em Fortaleza, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Só biblioteca padrão aqui — nada para instalar.
      - name: Contribuições
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
      - name: Card neofetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_info_card.py
      - name: Banner
        run: python scripts/make_header_svg.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza arte do perfil [skip ci]"
            git push
          fi
